<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shadowbud — Digital Body Doubling for ADHD</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #121824;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      
      /* Store Button Colors matching your brand glow */
      --payhip: #38bdf8;
      --kdp: #fbbf24;
      --redbubble: #ef4444;
      --gumroad: #f472b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Header Nav */
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
    }

    .logo img {
      height: 40px;
    }

    nav a {
      color: var(--text-sub);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--text-main);
    }

    /* Main Grid */
    main {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 60px;
      margin: auto 0;
      padding: 40px 0;
    }

    .character-container {
      flex: 1 1 400px;
      display: flex;
      justify-content: center;
    }

    .character-container img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.25));
    }

    .content-container {
      flex: 1 1 450px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 1.15rem;
      line-height: 1.6;
    }

    .store-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 10px;
    }

    /* Store Links */
    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      color: #000;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-link:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .btn-payhip { background-color: var(--payhip); color: #04121e; }
    .btn-kdp { background-color: var(--kdp); color: #1e1300; }
    .btn-redbubble { background-color: var(--redbubble); color: #ffffff; }
    .btn-gumroad { background-color: var(--gumroad); color: #210212; }

    /* Footer */
    footer {
      width: 100%;
      max-width: 1100px;
      text-align: center;
      padding: 30px 0;
      color: var(--text-sub);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <img src="logo.png" alt="SHADOWBUD">
    </div>
    <nav>
      <a href="#about">About</a>
      <a href="#blog">Blog</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Hero Content -->
  <main>
    <div class="character-container">
      <img src="shadowbud.png" alt="My Shadowbud Mascot">
    </div>

    <div class="content-container">
      <h1>Welcome, I'm your Shadowbud.</h1>
      <p class="subtitle">Digital Body Doubling for ADHD: Your companion for focus, not distraction.</p>
      
      <h2 class="store-title">Store Hub</h2>

      <div class="links-grid">
        <!-- REPLACE '#' WITH YOUR ACTUAL STORE URLS -->
        <a href="#" class="btn-link btn-payhip" target="_blank">
          🤍 Get Free Downloads (Payhip)
        </a>
        <a href="#" class="btn-link btn-kdp" target="_blank">
          📖 Books & Tools (KDP)
        </a>
        <a href="#" class="btn-link btn-redbubble" target="_blank">
          🔴 Redbubble Merch
        </a>
        <a href="#" class="btn-link btn-gumroad" target="_blank">
          🎁 Premium Resources (Gumroad)
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; My Shadowbud. All rights reserved.
  </footer>

</body>
</html>
